name: CI
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
        working-directory: ./Real_Time_Chatbot
      - name: Run emulator tests
        run: npm run test:emul
        working-directory: ./Real_Time_Chatbot
