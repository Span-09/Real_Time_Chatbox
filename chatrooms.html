<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/chatrooms.css">
</head>
<body>
    <!-- Add this just before your main chat container -->
<div id="login-modal" class="modal-overlay" style="display: flex;">
  <div class="modal-content">
    <h2>Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="form-group" style="position: relative;">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" minlength="6" />
        <span id="toggle-password" class="eye-icon" style="position: absolute; right: 12px; top: 38px; cursor: pointer;">
          👁️
        </span>
      </div>
      <div class="modal-actions">
        <button type="submit" id="login-btn">Login</button>
      </div>
      <div id="login-error" style="color: red; margin-top: 8px;"></div>
    </form>
  </div>
</div>

    <div class="chat-container">
    <header class="chat-header">
    <h1 class="room-title">Chats</h1>
    <div class="header-actions">
      <button id="create-room-btn" class="create-room-button" aria-label="Create Room">+</button>
      <img id="user-avatar" class="user-avatar" src="" alt="User profile" title="Profile" />
    </div>
  </header>

        <div class="search-container">
            <input type="text" id="search-bar" class="search-bar" placeholder="Search chats...">
        </div>  

        <main id="chatroom-list" class="chatroom-list">
            <div class="chatroom-item-skeleton"></div>
            <div class="chatroom-item-skeleton"></div>
            <div class="chatroom-item-skeleton"></div>
        </main>
    </div>

    <script type="module" src="chatrooms.js"></script>
    <div id="create-room-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Create New Chat Room</h2>
        <form id="create-room-form">
            <div class="form-group">
                <label for="room-title-input">Room Title</label>
                <input type="text" id="room-title-input" placeholder="Room Title" required />
                <div id="create-room-error" class="form-error" role="alert" aria-live="polite"></div>
            </div>
            <div class="form-group">
                <label for="member-picker">Add Members</label>
                <input type="text" id="member-picker" placeholder="Type to search users..." autocomplete="off" />
                <div id="member-search-results"></div>
                <div id="selected-members" class="selected-members"></div>
            </div>
            <div class="form-group">
                <label for="create-from-room">Create from existing room...</label>
                <select id="create-from-room">
                    <option value="">Select a room</option>
                    <!-- Populate with room titles -->
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancel-create-room">Cancel</button>
                <button type="submit" id="create-room-confirm-btn">Create Room</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
